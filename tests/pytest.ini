[pytest]
# Pytest configuration for pronunciation tests

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for organizing tests
markers =
    hindi: Tests for Hindi pronunciation
    english: Tests for English pronunciation  
    schwa_deletion: Tests for schwa deletion rules
    geminate: Tests for geminate consonants
    aspiration: Tests for aspirated consonants
    vowel_length: Tests for vowel length distinctions
    stress: Tests for word stress patterns
    regression: Regression test cases (known issues)

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short

# Collect warnings as errors (optional)
filterwarnings =
    error
    ignore::DeprecationWarning
